openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profitability
    description: Manufacturing profitability and answer operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [profitability]
      summary: Get the profitability cockpit summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /prototype-profile:
    get:
      operationId: getPrototypeProfile
      tags: [profitability]
      summary: Get prototype assumptions and ideal customer profile
      responses:
        "200":
          description: Prototype product assumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrototypeProfile"
  /uploads/analyze:
    post:
      operationId: analyzeUpload
      tags: [profitability]
      summary: Profile an uploaded production dataset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAnalysisInput"
      responses:
        "200":
          description: Dataset profile and mapping suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadAnalysis"
  /uploads:
    get:
      operationId: getUploads
      tags: [profitability]
      summary: Get persisted upload analyses for the current workspace
      responses:
        "200":
          description: Recent workspace uploads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadRecord"
  /data-quality:
    get:
      operationId: getDataQuality
      tags: [profitability]
      summary: Get readiness and data-quality checks
      responses:
        "200":
          description: Current data readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataQualitySummary"
  /semantic-model:
    get:
      operationId: getSemanticModel
      tags: [profitability]
      summary: Get the approved food manufacturing semantic model
      responses:
        "200":
          description: Semantic model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SemanticModel"
  /kpis:
    get:
      operationId: getKpis
      tags: [profitability]
      summary: Get governed food processing KPIs
      responses:
        "200":
          description: KPI catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Kpi"
  /recommendations:
    get:
      operationId: getRecommendations
      tags: [profitability]
      summary: Get evidence-backed improvement recommendations
      responses:
        "200":
          description: Prioritized recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
  /team:
    get:
      operationId: getTeam
      tags: [profitability]
      summary: Get workspace members and data roles
      responses:
        "200":
          description: Workspace team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
  /jobs:
    get:
      operationId: getJobs
      tags: [profitability]
      summary: List recent manufacturing jobs
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, at-risk, profitable, closed]
            default: all
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [profitability]
      summary: Get a job with cost evidence
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
  /questions/ask:
    post:
      operationId: askQuestion
      tags: [profitability]
      summary: Ask a source-backed profitability question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: Source-backed answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionAnswer"
        "400":
          description: Unsupported or empty question
  /questions/history:
    get:
      operationId: getQuestionHistory
      tags: [profitability]
      summary: Get persisted consultant questions for the current workspace
      responses:
        "200":
          description: Recent question history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionHistoryItem"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [profitability]
      summary: Get real workspace usage and persistence metrics
      responses:
        "200":
          description: Workspace administration overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /sources:
    get:
      operationId: getSources
      tags: [profitability]
      summary: Get connected source health
      responses:
        "200":
          description: Connected data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSource"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      properties:
        period:
          type: string
        revenue:
          type: number
        contributionMargin:
          type: number
        contributionMarginRate:
          type: number
        atRiskJobs:
          type: integer
        closedJobs:
          type: integer
        marginChange:
          type: number
        yieldRate:
          type: number
        wasteCost:
          type: number
        scheduleAttainment:
          type: number
        ordersOnHold:
          type: integer
        lastSyncedAt:
          type: string
      required:
        - period
        - revenue
        - contributionMargin
        - contributionMarginRate
        - atRiskJobs
        - closedJobs
        - marginChange
        - yieldRate
        - wasteCost
        - scheduleAttainment
        - ordersOnHold
        - lastSyncedAt
    PrototypeProfile:
      type: object
      properties:
        productName:
          type: string
        workspaceName:
          type: string
        icp:
          type: array
          items:
            type: string
        assumptions:
          type: array
          items:
            type: string
        firstDecision:
          type: string
        updateCadence:
          type: string
        prototypeLimits:
          type: array
          items:
            type: string
      required:
        - productName
        - workspaceName
        - icp
        - assumptions
        - firstDecision
        - updateCadence
        - prototypeLimits
    UploadAnalysisInput:
      type: object
      properties:
        fileName:
          type: string
        sizeBytes:
          type: integer
        rowCount:
          type: integer
        columns:
          type: array
          items:
            type: string
      required: [fileName, sizeBytes, rowCount, columns]
    MappingSuggestion:
      type: object
      properties:
        sourceColumn:
          type: string
        semanticField:
          type: string
        confidence:
          type: number
        status:
          type: string
          enum: [auto-mapped, review, unmapped]
      required: [sourceColumn, semanticField, confidence, status]
    DataQualityCheck:
      type: object
      properties:
        id:
          type: string
        category:
          type: string
        title:
          type: string
        detail:
          type: string
        severity:
          type: string
          enum: [critical, warning, info]
        affectedRows:
          type: integer
        affectedValue:
          type: number
        status:
          type: string
          enum: [passed, review, blocked]
        owner:
          type: string
      required:
        - id
        - category
        - title
        - detail
        - severity
        - affectedRows
        - affectedValue
        - status
        - owner
    UploadAnalysis:
      type: object
      properties:
        datasetName:
          type: string
        inferredType:
          type: string
        status:
          type: string
          enum: [ready, ready-with-caveats, needs-review]
        rowCount:
          type: integer
        columnsDetected:
          type: integer
        readinessScore:
          type: number
        mappings:
          type: array
          items:
            $ref: "#/components/schemas/MappingSuggestion"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/DataQualityCheck"
      required:
        - datasetName
        - inferredType
        - status
        - rowCount
        - columnsDetected
        - readinessScore
        - mappings
        - issues
    UploadRecord:
      type: object
      properties:
        id:
          type: integer
        fileName:
          type: string
        sizeBytes:
          type: integer
        rowCount:
          type: integer
        readinessScore:
          type: number
        status:
          type: string
        createdAt:
          type: string
      required: [id, fileName, sizeBytes, rowCount, readinessScore, status, createdAt]
    DataQualitySummary:
      type: object
      properties:
        readiness:
          type: string
          enum: [ready, ready-with-caveats, blocked]
        overallScore:
          type: number
        revenueCoverage:
          type: number
        costCoverage:
          type: number
        traceabilityCoverage:
          type: number
        blockedKpis:
          type: integer
        reviewItems:
          type: integer
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DataQualityCheck"
      required:
        - readiness
        - overallScore
        - revenueCoverage
        - costCoverage
        - traceabilityCoverage
        - blockedKpis
        - reviewItems
        - checks
    SemanticEntity:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        source:
          type: string
        confidence:
          type: number
        status:
          type: string
          enum: [approved, review, draft]
      required: [name, description, source, confidence, status]
    SemanticRelationship:
      type: object
      properties:
        from:
          type: string
        to:
          type: string
        label:
          type: string
      required: [from, to, label]
    MetricDefinition:
      type: object
      properties:
        name:
          type: string
        formula:
          type: string
        businessDefinition:
          type: string
        owner:
          type: string
        status:
          type: string
          enum: [approved, review, draft]
      required: [name, formula, businessDefinition, owner, status]
    SemanticModel:
      type: object
      properties:
        version:
          type: string
        approvedAt:
          type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/SemanticEntity"
        relationships:
          type: array
          items:
            $ref: "#/components/schemas/SemanticRelationship"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricDefinition"
      required: [version, approvedAt, entities, relationships, metrics]
    Kpi:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: number
        unit:
          type: string
        target:
          type: number
        direction:
          type: string
          enum: [up, down, flat]
        change:
          type: number
        status:
          type: string
          enum: [on-track, watch, off-track]
        definition:
          type: string
        businessQuestion:
          type: string
        owner:
          type: string
      required:
        - id
        - name
        - value
        - unit
        - target
        - direction
        - change
        - status
        - definition
        - businessQuestion
        - owner
    Recommendation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        finding:
          type: string
        rationale:
          type: string
        expectedImpact:
          type: string
        effort:
          type: string
          enum: [low, medium, high]
        confidence:
          type: string
          enum: [high, medium, low]
        owner:
          type: string
        horizon:
          type: string
        status:
          type: string
          enum: [proposed, accepted, monitoring]
        evidence:
          type: array
          items:
            type: string
      required:
        - id
        - title
        - finding
        - rationale
        - expectedImpact
        - effort
        - confidence
        - owner
        - horizon
        - status
        - evidence
    TeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
        scope:
          type: string
        approvals:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [active, invited]
      required: [id, name, email, role, scope, approvals, status]
    Job:
      type: object
      properties:
        id:
          type: string
        jobNumber:
          type: string
        customer:
          type: string
        product:
          type: string
        status:
          type: string
          enum: [open, at-risk, closed]
        dueDate:
          type: string
        revenue:
          type: number
        estimatedCost:
          type: number
        actualCost:
          type: number
        margin:
          type: number
        marginRate:
          type: number
        primaryLeak:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
      required:
        - id
        - jobNumber
        - customer
        - product
        - status
        - dueDate
        - revenue
        - estimatedCost
        - actualCost
        - margin
        - marginRate
        - primaryLeak
        - confidence
    CostLine:
      type: object
      properties:
        category:
          type: string
        estimated:
          type: number
        actual:
          type: number
        variance:
          type: number
        source:
          type: string
        note:
          type: string
      required: [category, estimated, actual, variance, source, note]
    EvidenceItem:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
        source:
          type: string
        detail:
          type: string
      required: [label, value, source, detail]
    JobDetail:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            openedAt:
              type: string
            customerId:
              type: string
            costLines:
              type: array
              items:
                $ref: "#/components/schemas/CostLine"
            evidence:
              type: array
              items:
                $ref: "#/components/schemas/EvidenceItem"
          required: [openedAt, customerId, costLines, evidence]
    QuestionInput:
      type: object
      properties:
        question:
          type: string
          minLength: 1
      required: [question]
    QuestionAnswer:
      type: object
      properties:
        question:
          type: string
        answer:
          type: string
        headline:
          type: string
        metric:
          type: string
        metricValue:
          type: number
        metricUnit:
          type: string
        asOf:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        caveat:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceItem"
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
      required:
        - question
        - answer
        - headline
        - metric
        - metricValue
        - metricUnit
        - asOf
        - confidence
        - caveat
        - evidence
        - jobs
    QuestionHistoryItem:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        headline:
          type: string
        answer:
          type: string
        createdAt:
          type: string
      required: [id, question, headline, answer, createdAt]
    AdminUser:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
        lastSeenAt:
          type: string
      required: [userId, displayName, role, lastSeenAt]
    AdminActivity:
      type: object
      properties:
        type:
          type: string
        label:
          type: string
        detail:
          type: string
        occurredAt:
          type: string
      required: [type, label, detail, occurredAt]
    AdminOverview:
      type: object
      properties:
        workspaceName:
          type: string
        persistent:
          type: boolean
        userCount:
          type: integer
        productionRunCount:
          type: integer
        uploadCount:
          type: integer
        questionCount:
          type: integer
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AdminActivity"
      required: [workspaceName, persistent, userCount, productionRunCount, uploadCount, questionCount, users, recentActivity]
    DataSource:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [connected, needs-review, planned]
        recordCount:
          type: integer
        lastSyncedAt:
          type: string
        detail:
          type: string
      required: [id, name, type, status, recordCount, lastSyncedAt, detail]

